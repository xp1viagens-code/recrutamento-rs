<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}R&S{% endblock %} — RecrutaFácil</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --border: #E2E0D8;
  --text: #1A1916;
  --muted: #6B6960;
  --accent: #1A3A2A;
  --accent-light: #E8F0EB;
  --danger: #B03A2E;
  --danger-light: #FDECEA;
  --warn: #7A5C00;
  --warn-light: #FFF8E1;
  --info: #1A3A5C;
  --info-light: #E8F0F8;
  --success: #1A5C3A;
  --success-light: #E8F5EE;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; }
h1,h2,h3 { font-family: 'DM Serif Display', serif; font-weight: 400; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.nav {
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 2rem;
  padding: 0 2rem;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.nav-brand { font-family: 'DM Serif Display', serif; font-size: 20px; color: #fff; letter-spacing: -.3px; }
.nav-brand span { opacity: .6; font-size: 13px; font-family: 'DM Sans', sans-serif; margin-left: 8px; }
.nav a { color: rgba(255,255,255,.75); font-size: 13px; font-weight: 400; transition: color .15s; }
.nav a:hover { color: #fff; text-decoration: none; }
.nav-sep { flex: 1; }

.container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }
.page-header { margin-bottom: 2rem; }
.page-header h1 { font-size: 28px; }
.page-header p { color: var(--muted); margin-top: 4px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
.card-sm { padding: 1rem 1.25rem; }
.card h3 { font-size: 16px; margin-bottom: .75rem; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s; font-family: 'DM Sans', sans-serif; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: .88; }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

.form-group { margin-bottom: 1rem; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; letter-spacing: .03em; text-transform: uppercase; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
  background: #fff; outline: none; transition: border-color .15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }

.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-curriculo   { background: #EEF2FF; color: #3730A3; }
.badge-ligacao     { background: var(--warn-light); color: var(--warn); }
.badge-entrevista  { background: var(--info-light); color: var(--info); }
.badge-testes      { background: #F3E8FF; color: #6B21A8; }
.badge-debriefing  { background: #FFF0E6; color: #7C3009; }
.badge-evp         { background: var(--success-light); color: var(--success); }
.badge-contratado  { background: var(--success-light); color: var(--success); font-weight: 700; }
.badge-reprovado_ligacao, .badge-reprovado_entrevista, .badge-reprovado_testes, .badge-reprovado_debriefing, .badge-recusou_evp { background: var(--danger-light); color: var(--danger); }

.etapa-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 20px; font-size: 12px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--border); }
td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }

.stat { text-align: center; }
.stat-num { font-family: 'DM Serif Display', serif; font-size: 36px; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

.pipeline { display: flex; align-items: center; gap: 0; margin: 1.5rem 0; }
.pipeline-step { flex: 1; text-align: center; padding: 8px 4px; font-size: 11px; color: var(--muted); position: relative; }
.pipeline-step.active { color: var(--accent); font-weight: 500; }
.pipeline-step.done { color: var(--success); }
.pipeline-step.fail { color: var(--danger); }
.pipeline-step::after { content:'›'; position:absolute; right:-6px; top:50%; transform:translateY(-50%); color:var(--border); font-size:16px; }
.pipeline-step:last-child::after { display: none; }

.section-title { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }

.checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: .5rem; }
.checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
.checkbox-row label { font-size: 13px; color: var(--text); }

.alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 1rem; }
.alert-success { background: var(--success-light); color: var(--success); }
.alert-danger { background: var(--danger-light); color: var(--danger); }
.alert-warn { background: var(--warn-light); color: var(--warn); }
.alert-info { background: var(--info-light); color: var(--info); }

.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 500; flex-shrink: 0; }

.flex { display: flex; }
.items-center { align-items: center; }
.gap-2 { gap: .5rem; }
.gap-3 { gap: .75rem; }
.gap-4 { gap: 1rem; }
.justify-between { justify-content: space-between; }
.mt-1 { margin-top: .25rem; }
.mt-2 { margin-top: .5rem; }
.mt-3 { margin-top: .75rem; }
.mb-1 { margin-bottom: .25rem; }
.mb-2 { margin-bottom: .5rem; }
.text-muted { color: var(--muted); }
.text-sm { font-size: 12px; }
.fw-500 { font-weight: 500; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <span class="nav-brand">RecrutaFácil <span>R&S</span></span>
  <a href="/rh">Painel RH</a>
  <a href="/rh/candidatos">Candidatos</a>
  <a href="/rh/vagas/nova">Nova Vaga</a>
  <div class="nav-sep"></div>
  <a href="/candidato" style="background:rgba(255,255,255,.15);padding:5px 14px;border-radius:6px;">Portal do Candidato</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
