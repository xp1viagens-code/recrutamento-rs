{% extends "base.html" %}
{% block title %}Início{% endblock %}
{% block content %}
<div class="container" style="max-width:800px;text-align:center;padding-top:5rem;">
  <h1 style="font-size:48px;letter-spacing:-.5px;">RecrutaFácil</h1>
  <p style="color:var(--muted);font-size:16px;margin-top:.75rem;margin-bottom:3rem;">Sistema de Recrutamento e Seleção</p>
  <div class="grid-2" style="max-width:520px;margin:0 auto;gap:1.5rem;">
    <a href="/candidato" style="display:block;text-decoration:none;">
      <div class="card" style="text-align:center;padding:2.5rem 1.5rem;cursor:pointer;transition:box-shadow .2s;border:2px solid transparent;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='transparent'">
        <div style="font-size:36px;margin-bottom:1rem;">📄</div>
        <h3 style="font-size:18px;">Sou Candidato</h3>
        <p class="text-muted text-sm mt-2">Envie seu currículo e acompanhe o processo seletivo</p>
      </div>
    </a>
    <a href="/rh" style="display:block;text-decoration:none;">
      <div class="card" style="text-align:center;padding:2.5rem 1.5rem;cursor:pointer;transition:box-shadow .2s;border:2px solid transparent;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='transparent'">
        <div style="font-size:36px;margin-bottom:1rem;">🏢</div>
        <h3 style="font-size:18px;">Sou RH</h3>
        <p class="text-muted text-sm mt-2">Gerencie vagas, candidatos e etapas do processo</p>
      </div>
    </a>
  </div>
</div>
{% endblock %}
